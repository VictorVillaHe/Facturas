<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FacturaIA</title><meta name="theme-color" content="#101026"><style>
:root{--card:#12122a;--line:#30375f;--txt:#f7f8ff;--mut:#aab0cc;--acc:#4ecdc4;--bad:#ff6b6b;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:#09091a;color:var(--txt);font-family:system-ui}.wrap{max-width:1100px;margin:auto;padding:14px 14px 95px}.card,.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.top,.section,.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.row,.grid,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field{width:100%;padding:12px;margin:5px 0;border:1px solid var(--line);border-radius:13px;background:#0d0f24;color:var(--txt);font:inherit}.missing{border-color:#a77b19}.hide{display:none!important}button{border:0;border-radius:13px;padding:11px;background:var(--acc);font-weight:800}.ghost{background:#232844;color:#fff}.warn{background:var(--warn)}.bad{background:var(--bad);color:#fff}.ok{background:#0f766e;color:#fff}.mini,label{font-size:12px;color:var(--mut)}.photo{width:100%;max-height:320px;object-fit:contain;background:#111;border-radius:15px;margin:8px 0}.bar{height:8px;background:#22284f;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}.chips,.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{padding:4px 8px;border-radius:20px;background:#272b50;font-size:11px}.kpi{background:#171936;border:1px solid #242b50;border-radius:16px;padding:12px}.kpi b{display:block;color:var(--acc);font-size:22px}.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#101026f5;z-index:10}.tab{text-align:center;padding:10px;color:#ccc;font-size:12px}.tab.active{color:var(--acc);font-weight:900}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:15px;z-index:99}.modal>div{max-width:900px;width:100%;background:var(--card);padding:15px;border-radius:18px}@media(min-width:760px){.row{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}.tabs{left:50%;transform:translateX(-50%);max-width:600px}}
</style></head><body><main class="wrap"><div class="top"><div><h2 style="margin:0">FacturaIA</h2><span class="mini">Control Local Inteligente</span></div><button class="ghost" onclick="tab(3)">Perfil</button></div>
<section id="p0"><div class="card"><div class="section"><h3 id="formTitle">Nuevo ticket</h3><button id="btnAI" class="warn" onclick="analyzeAI()">Analizar con IA</button></div><input id="cam" type="file" accept="image/*" capture="environment" class="field"><img id="preview" class="photo hide"><div class="bar"><i id="progress"></i></div><p id="statusText" class="mini">Toma una foto o selecciona un archivo.</p><div id="validation" class="chips"></div>
<div class="row"><div><label>Comercio</label><input id="store" class="field req"></div><div><label>Fecha ticket</label><input id="date" type="date" class="field req"></div><div><label>Total MXN</label><input id="total" type="number" class="field req"></div><div><label>Vence factura</label><input id="due" type="date" class="field"></div></div><div class="row"><div><label>Folio</label><input id="folio" class="field"></div><div><label>Referencia</label><input id="ref" class="field"></div><div><label>URL factura</label><input id="invoiceUrl" class="field"></div><div><label>Estatus</label><select id="status" class="field"><option>Pendiente</option><option>Solicitada</option><option>Facturada</option><option>No facturable</option></select></div></div><div class="row"><div><label>Subtotal</label><input id="subtotal" type="number" class="field"></div><div><label>Servicio</label><input id="service" type="number" class="field"></div><div><label>RFC emisor</label><input id="issuerRfc" class="field"></div><div><label>Email emisor</label><input id="issuerEmail" class="field"></div></div><div class="row"><div><label>WhatsApp emisor</label><input id="issuerWhatsapp" class="field"></div><div><label>Categoría</label><input id="category" class="field"></div><div><label>Pago detectado</label><input id="payDetected" class="field"></div></div><label>Notas / IA</label><textarea id="data" class="field"></textarea><div class="actions"><button onclick="saveTicket()">Guardar ticket</button><button class="ghost" onclick="fillDue()">Llenar vencimiento</button><button class="ghost" onclick="clearForm()">Limpiar</button><button id="cancelEdit" class="bad hide" onclick="clearForm()">Cancelar edición</button></div></div><div id="kpis" class="grid"></div></section>
<section id="p1" class="hide"><div class="card"><div class="section"><h3>Historial</h3><button class="ghost" onclick="render()">Actualizar</button></div><input id="q" class="field" placeholder="Buscar..."><div class="row"><div><label>Estatus</label><select id="filterStatus" class="field"><option value="">Todos</option><option selected>Pendiente</option><option>Solicitada</option><option>Facturada</option><option>No facturable</option></select></div><div><label>Ordenar</label><select id="sortBy" class="field"><option value="due">Vencimiento</option><option value="date">Fecha</option><option value="total">Total</option><option value="store">Comercio</option></select></div></div><div class="btnrow"><button onclick="exportCSV()">Exportar CSV</button><button class="warn" onclick="exportPending()">Exportar pendientes</button></div></div><div id="list"></div></section>
<section id="p2" class="hide"><div class="card"><h3>Alertas</h3><div id="alerts"></div></div></section>
<section id="p3" class="hide"><div class="card"><div class="section"><h3>Datos fiscales</h3><button onclick="saveProfile()">Guardar perfil</button></div><div class="row"><div><label>Razón social</label><input id="pfName" class="field"></div><div><label>RFC</label><input id="pfRfc" class="field"></div><div><label>Régimen</label><input id="pfRegimen" class="field"></div><div><label>Uso CFDI</label><input id="pfCfdi" class="field"></div></div><div class="row"><div><label>Domicilio</label><input id="pfAddress" class="field"></div><div><label>Colonia y CP</label><input id="pfColony" class="field"></div><div><label>Ciudad y estado</label><input id="pfCity" class="field"></div><div><label>Forma de pago</label><input id="pfPay" class="field"></div></div><div class="row"><div><label>Correo fiscal</label><input id="pfEmail" class="field"></div><div><label>Correo para recibir tickets</label><input id="pfNotifyEmail" class="field"></div><div><label>Mi WhatsApp</label><input id="pfNotifyWhatsapp" class="field"></div><div><label>Canal preferido</label><select id="pfNotifyMethod" class="field"><option>WhatsApp</option><option>Email</option></select></div></div></div>
<div class="card"><div class="section"><h3>Contactos WhatsApp</h3><button onclick="addContact()">Agregar</button></div><div class="row"><div><label>Nombre</label><input id="contactName" class="field"></div><div><label>Número con código de país</label><input id="contactPhone" class="field" placeholder="5213410000000"></div></div><div id="contacts"></div></div>
<div class="card"><h3>Configuración</h3><div class="btnrow"><button class="ghost" onclick="changeApi()">Cambiar API Key</button><button class="ghost" onclick="testApi()">Probar API Key</button><button class="bad" onclick="resetAll()">Borrar todo</button></div></div></section></main>
<nav class="tabs"><div class="tab active" onclick="tab(0)">📷<br>Escanear</div><div class="tab" onclick="tab(1)">📜<br>Historial</div><div class="tab" onclick="tab(2)">⏰<br>Alertas</div><div class="tab" onclick="tab(3)">👤<br>Perfil</div></nav><div id="modal" class="modal hide"><div><button class="bad" onclick="hide('modal')">Cerrar</button><img id="modalImg" class="photo"></div></div>
<script>
'use strict';const $=id=>document.getElementById(id),show=id=>$(id)?.classList.remove('hide'),hide=id=>$(id)?.classList.add('hide'),API='facturaia_gemini_api_key',F=['store','date','total','due','folio','ref','invoiceUrl','subtotal','service','issuerRfc','issuerEmail','issuerWhatsapp','category','payDetected','data','status'];let items={},contacts=[],profile={},photo='',canvas=null,editId=null;const val=(id,v)=>{if($(id)&&v!=null)$(id).value=v},phone=v=>String(v||'').replace(/\D/g,''),now=()=>new Date().toISOString(),money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),days=d=>d?Math.ceil((new Date(d+'T12:00:00')-new Date(new Date().toISOString().slice(0,10)+'T12:00:00'))/864e5):null,wait=ms=>new Promise(r=>setTimeout(r,ms));
function load(){try{items=JSON.parse(localStorage.fac_items||'{}')}catch{}try{contacts=JSON.parse(localStorage.fac_contacts||'[]')}catch{}try{profile=JSON.parse(localStorage.fac_profile||'{}')}catch{}profile={cfdi:'Gastos en general',pay:'Tarjeta de crédito',notifyMethod:'WhatsApp',...profile};profileForm()}function save(){localStorage.fac_items=JSON.stringify(items);localStorage.fac_contacts=JSON.stringify(contacts);localStorage.fac_profile=JSON.stringify(profile)}function profileForm(){let m={name:'pfName',rfc:'pfRfc',regimen:'pfRegimen',cfdi:'pfCfdi',address:'pfAddress',colony:'pfColony',city:'pfCity',pay:'pfPay',email:'pfEmail',notifyEmail:'pfNotifyEmail',notifyWhatsapp:'pfNotifyWhatsapp',notifyMethod:'pfNotifyMethod'};Object.entries(m).forEach(([k,id])=>val(id,profile[k]||''))}function formProfile(){let m={name:'pfName',rfc:'pfRfc',regimen:'pfRegimen',cfdi:'pfCfdi',address:'pfAddress',colony:'pfColony',city:'pfCity',pay:'pfPay',email:'pfEmail',notifyEmail:'pfNotifyEmail',notifyWhatsapp:'pfNotifyWhatsapp',notifyMethod:'pfNotifyMethod'};Object.entries(m).forEach(([k,id])=>profile[k]=$(id).value);profile.notifyWhatsapp=phone(profile.notifyWhatsapp)}
function tab(n){['p0','p1','p2','p3'].forEach((id,i)=>$(id).classList.toggle('hide',i!==n));document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===n));render()}function validate(){let a=[['store','tienda'],['date','fecha'],['total','total']].filter(x=>!$(x[0]).value);document.querySelectorAll('.req').forEach(x=>x.classList.toggle('missing',!x.value));$('validation').innerHTML=a.map(x=>`<span class="chip">Falta ${x[1]}</span>`).join('');return a}function current(){let old=editId?items[editId]:null,t={id:old?.id||Date.now().toString(),createdAt:old?.createdAt||now(),updatedAt:now(),photo,profile:{...profile}};F.forEach(k=>t[k]=$(k).value);['total','subtotal','service'].forEach(k=>t[k]=Number(t[k]||0));return t}function saveTicket(){if(validate().length)return alert('Faltan datos básicos.');formProfile();let t=current();items[t.id]=t;save();clearForm();tab(1)}function clearForm(){F.forEach(k=>val(k,''));val('status','Pendiente');photo='';canvas=null;editId=null;hide('preview');hide('cancelEdit');$('formTitle').textContent='Nuevo ticket';validate()}function editTicket(id){let t=items[id];editId=id;F.forEach(k=>val(k,t[k]));photo=t.photo||'';$('preview').src=photo;$('preview').classList.toggle('hide',!photo);show('cancelEdit');$('formTitle').textContent='Editar ticket';tab(0)}function fillDue(){let d=new Date(($('date').value||new Date().toISOString().slice(0,10))+'T12:00:00');d.setDate(d.getDate()+30);val('due',d.toISOString().slice(0,10))}
function message(t){let p=t.profile||profile;return `Solicitud de factura:\nComercio: ${t.store}\nFecha: ${t.date}\nTotal: ${money(t.total)}\nFolio: ${t.folio||'N/A'}\nReferencia: ${t.ref||'N/A'}\nPágina para facturar: ${t.invoiceUrl||'No detectada'}\n\nDatos fiscales:\nRazón social: ${p.name||''}\nRFC: ${p.rfc||''}\nRégimen: ${p.regimen||''}\nUso CFDI: ${p.cfdi||''}\nCorreo: ${p.email||''}`}function fileFromData(data){if(!data)return null;let [h,b]=data.split(','),type=(h.match(/:(.*?);/)||[])[1]||'image/jpeg',x=atob(b),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return new File([u],'ticket.jpg',{type})}async function sharePhoto(t){let d={title:'Ticket '+t.store,text:message(t)},f=fileFromData(t.photo);if(f&&navigator.canShare?.({files:[f]}))d.files=[f];else if(t.invoiceUrl)d.url=t.invoiceUrl;if(navigator.share)return navigator.share(d);copyText(d.text)}function wa(t,n){n=phone(n);if(!n)return chooseContact(t);open(`https://wa.me/${n}?text=${encodeURIComponent(message(t))}`,'_blank')}function chooseContact(t){if(!contacts.length)return alert('Agrega contactos en Perfil.');let n=prompt(contacts.map((c,i)=>`${i+1}. ${c.name} - ${c.phone}`).join('\n')),c=contacts[Number(n)-1];if(c)wa(t,c.phone)}function email(t){let to=t.issuerEmail||prompt('Correo destino:');if(to)location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent('Factura '+t.store)}&body=${encodeURIComponent(message(t))}`}function sendMe(t){formProfile();save();profile.notifyMethod==='Email'?profile.notifyEmail?location.href=`mailto:${profile.notifyEmail}?subject=Ticket&body=${encodeURIComponent(message(t))}`:alert('Configura tu correo.'):profile.notifyWhatsapp?wa(t,profile.notifyWhatsapp):alert('Configura tu WhatsApp.')}async function copyText(x){try{await navigator.clipboard.writeText(x);alert('Copiado.')}catch{prompt('Copia:',x)}}
function render(){let a=Object.values(items),p=a.filter(x=>x.status==='Pendiente');$('kpis').innerHTML=[['Pendientes',p.length],['Total tickets',a.length],['Monto pendiente',money(p.reduce((s,x)=>s+x.total,0))]].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');let q=$('q').value.toLowerCase(),st=$('filterStatus').value;a=a.filter(x=>(!st||x.status===st)&&[x.store,x.folio,x.ref].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(x=>`<div class="item"><div class="head"><div><b>${esc(x.store)}</b><div class="mini">${x.date}</div></div><b>${money(x.total)}</b></div>${x.photo?`<img class="photo" src="${x.photo}" onclick="showPhoto('${x.id}')">`:''}<div class="btnrow"><button onclick="editTicket('${x.id}')">Editar</button><button class="warn" onclick="openUrl('${x.id}')">Facturar</button><button class="ghost" onclick="wa(items['${x.id}'],items['${x.id}'].issuerWhatsapp)">WhatsApp emisor</button><button class="ghost" onclick="chooseContact(items['${x.id}'])">Enviar a contacto</button><button class="ghost" onclick="email(items['${x.id}'])">Correo</button><button class="ok" onclick="sendMe(items['${x.id}'])">Enviarme</button><button class="ghost" onclick="sharePhoto(items['${x.id}'])">Compartir con foto</button><button class="ok" onclick="setStatus('${x.id}','Facturada')">Facturada</button><button class="bad" onclick="removeTicket('${x.id}')">Eliminar</button></div></div>`).join(''):'<div class="card">No hay tickets.</div>';$('alerts').innerHTML=p.filter(x=>days(x.due)<=7).map(x=>`<div class="item">${esc(x.store)} · vence ${x.due}</div>`).join('')||'Sin alertas.';renderContacts()}function setStatus(id,s){items[id].status=s;save();render()}function removeTicket(id){if(confirm('¿Eliminar?')){delete items[id];save();render()}}function openUrl(id){items[id].invoiceUrl?open(items[id].invoiceUrl,'_blank'):alert('Sin URL.')}function showPhoto(id){$('modalImg').src=items[id].photo;show('modal')}
function renderContacts(){$('contacts').innerHTML=contacts.map(c=>`<div class="item"><b>${esc(c.name)}</b><div>${c.phone}</div><button class="bad" onclick="deleteContact('${c.id}')">Eliminar</button></div>`).join('')||'<p class="mini">Sin contactos.</p>'}function addContact(){let n=$('contactName').value.trim(),p=phone($('contactPhone').value);if(!n||!p)return alert('Captura nombre y número.');contacts.push({id:Date.now().toString(),name:n,phone:p});$('contactName').value='';$('contactPhone').value='';save();renderContacts()}function deleteContact(id){contacts=contacts.filter(c=>c.id!==id);save();renderContacts()}function saveProfile(){formProfile();save();alert('Perfil guardado.')}function changeApi(){let k=prompt('Gemini API Key:');if(k)localStorage.setItem(API,k.trim())}async function testApi(){try{let {GoogleGenAI}=await import('https://esm.run/@google/genai'),ai=new GoogleGenAI({apiKey:localStorage.getItem(API)}),r=await ai.models.generateContent({model:'gemini-2.5-flash',contents:'Responde OK'});alert(r.text)}catch(e){alert(e.message)}}function resetAll(){if(confirm('¿Borrar todo?')){localStorage.clear();location.reload()}}
function loadPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1400/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);canvas=c;photo=c.toDataURL('image/jpeg',.8);$('preview').src=photo;show('preview');analyzeAI()};im.src=r.result};r.readAsDataURL(f)}function parse(t){let s=String(t).replace(/```json|```/gi,'').trim();try{return JSON.parse(s)}catch{return JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1))}}async function qr(){if(!('BarcodeDetector'in window)||!canvas)return'';try{return (await new BarcodeDetector({formats:['qr_code']}).detect(canvas))[0]?.rawValue||''}catch{return''}}async function analyzeAI(){if(!canvas)return alert('Carga una foto.');let key=localStorage.getItem(API);if(!key){key=prompt('Pega tu Gemini API Key:');if(!key)return;localStorage.setItem(API,key)}$('btnAI').disabled=true;try{let code=await qr();if(/^https?:\/\//i.test(code))val('invoiceUrl',code);let {GoogleGenAI}=await import('https://esm.run/@google/genai'),ai=new GoogleGenAI({apiKey:key}),r,err,prompt='Devuelve SOLO JSON del ticket: {"store":"","date":"","total":0,"subtotal":0,"service":0,"folio":"","ref":"","url":"","email":"","whatsapp":"","rfc":"","category":"","payDetected":""}. No inventes.';for(let i=1;i<=3;i++){try{$('statusText').textContent=`Analizando. Intento ${i} de 3...`;$('progress').style.width=(i*30)+'%';r=await ai.models.generateContent({model:'gemini-2.5-flash',contents:[{role:'user',parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg',data:photo.split(',')[1]}}]}]});break}catch(e){err=e;if(i<3&&/503|UNAVAILABLE|high demand/i.test(e.message))await wait(i*2500);else throw e}}if(!r)throw err;let x=parse(r.text),m={store:'store',date:'date',total:'total',subtotal:'subtotal',service:'service',folio:'folio',ref:'ref',url:'invoiceUrl',email:'issuerEmail',whatsapp:'issuerWhatsapp',rfc:'issuerRfc',category:'category',payDetected:'payDetected'};Object.entries(m).forEach(([k,id])=>{if(x[k]!==''&&x[k]!=null&&!(id==='invoiceUrl'&&$('invoiceUrl').value))val(id,x[k])});if(x.date)fillDue();$('data').value=Object.entries(x).map(([k,v])=>`${k}: ${v}`).join('\n');$('statusText').textContent=code?'Procesado. QR detectado.':'Procesado.';$('progress').style.width='100%'}catch(e){$('statusText').textContent=/503|UNAVAILABLE|high demand/i.test(e.message)?'Gemini está saturado. Intenta de nuevo en unos segundos.':'No se pudo analizar: '+e.message;$('progress').style.width='0%'}finally{$('btnAI').disabled=false;validate()}}
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportData(a,n){let k=['store','date','total','due','status','folio','ref','invoiceUrl'],t='\ufeff'+k.map(csv).join(',')+'\n'+a.map(x=>k.map(y=>csv(x[y])).join(',')).join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));l.download=n;l.click()}function exportCSV(){exportData(Object.values(items),'facturaia.csv')}function exportPending(){exportData(Object.values(items).filter(x=>x.status==='Pendiente'),'pendientes.csv')}
Object.assign(window,{tab,saveTicket,clearForm,fillDue,editTicket,wa,chooseContact,email,sendMe,sharePhoto,setStatus,removeTicket,openUrl,showPhoto,addContact,deleteContact,saveProfile,changeApi,testApi,resetAll,analyzeAI,exportCSV,exportPending,items,show,hide});$('cam').onchange=loadPhoto;document.querySelectorAll('.req').forEach(x=>x.oninput=validate);['q','filterStatus','sortBy'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));load();render();validate();
</script></body></html>
